# ビルドして GitHub Pages に公開する共通ワークフロー。
#
# 単体では起動せず、deploy.yml（push 時）と sync-firestore.yml（同期後）から呼ばれる。
# 分けている理由: GITHUB_TOKEN による push は他のワークフローを起動しないという
# GitHub の再帰防止仕様があるため、同期側から直接この処理を呼ぶ必要がある。
#
# runner は ubuntu-latest ではなく版を固定する（全ワークフロー共通。T16）。
# ubuntu-latest は 2026-10-19 から 26.04 へ順に切り替わり、その間はジョブごとに版が混ざるため。
# 次の LTS に上げるときは、全ワークフローの runs-on をまとめて変えて npm run release -- --sync で確かめる。
name: 公開の共通処理
# 手動で公開し直したときだけ実行名が出る（呼ばれたときは呼び出し元の実行名になる。T31）
run-name: ${{ format('公開のやり直し・手動（{0}）', github.actor) }}

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      # 取り込み直後に呼ばれた場合、イベント発火時点の SHA は古い。
      # 既定ブランチの最新を明示的に取得する。
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          # Firebase のウェブ設定（ADR 0010）。公開してよい値なのでリポジトリの Variables に置く。
          # 未登録なら空になり、ログインと保存が無効のまま公開される
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      - run: npm run verify
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
