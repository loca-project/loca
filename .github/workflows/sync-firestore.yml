# Firestore から public/data/markers.json と requests.json を作り直す（要件 1.3 の定時バッチ。ADR 0010）。
#
# 毎日 0:00（日本時間）と、手動（workflow_dispatch）で動く。先に refresh ジョブで再生数などを更新する（ADR 0017）。
# 同期のあと purge ジョブが、論理削除から 30 日たった行を物理削除する（ADR 0021）。
# Firestore の markers と requests はルールで誰でも読めるので、API キー（公開値。Variables）だけで読む。
# サービスアカウントの鍵などの秘密情報は使わない。
#
# 変更があったときだけコミットし、publish.yml を直接呼んで公開しなおす
# （GITHUB_TOKEN による push は他のワークフローを起動しないため、deploy.yml には任せられない）。
name: 同期（Firestore → 公開データ）
# 実行名で契機を分ける（毎晩の定期と手動。命名規則は docs/70-publish.md。T31）。件数は各ジョブの概要に出る
run-name: ${{ github.event_name == 'schedule' && '同期・毎晩' || format('同期・手動（{0}）', github.actor) }}

on:
  schedule:
    - cron: '0 15 * * *' # UTC 15:00 = 日本時間 0:00
  workflow_dispatch:

# 手動と定期が重なっても public/data を同時に書き換えないよう、順番に動かす
concurrency:
  group: sync-data
  cancel-in-progress: false

jobs:
  # 再生数・投稿日・長さを YouTube Data API で更新し、消えた動画を論理削除する（T24・ADR 0017）。
  # 認証は Workload Identity 連携（鍵ファイルなし）。YouTube API が失敗したら何も書かずに止まる。
  refresh:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          create_credentials_file: false
      - name: YouTube の情報で Firestore のマーカーを更新する
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          GCP_PROJECT: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
        run: node scripts/refresh-youtube.mjs

  sync:
    # 更新が失敗しても公開データの作り直しは行う（失敗はこの実行の結果として赤で残る）
    needs: refresh
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # 依存パッケージを使わないスクリプトなので npm ci は要らない
      - name: Firestore から markers.json と requests.json を作り直す
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
        run: node scripts/sync-firestore.mjs

      - name: コミットして push
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/markers.json public/data/requests.json
          if git diff --cached --quiet; then
            echo "変更なし"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: Firestore から公開データを再生成"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # 論理削除・取り下げから 30 日たった行と動画の索引を物理削除する（ADR 0021・T58）。
  # 同期が成功したときだけ動く。作り直した公開データの syncedAt より後に消された行は消さない（scripts/lib/purge-plan.mjs）。
  # 公開データに含まれない行だけを消すので、publish とは関係なく、失敗しても公開は止めない。
  purge:
    needs: sync
    if: ${{ needs.sync.result == 'success' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          create_credentials_file: false
      - name: 30 日たった論理削除の行を消す
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          GCP_PROJECT: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
        run: node scripts/purge-deleted.mjs

  publish:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publish.yml
