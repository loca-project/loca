name: マーカーの投稿
description: 地図に動画マーカーを追加します（サイトの投稿ボタンから開くと入力済みになります）
title: "[marker] 新しいマーカー"
labels: ["loca:marker"]
body:
  - type: markdown
    attributes:
      value: |
        登録する YouTube URL は、**ご自身が制作し正当な権利を保有するコンテンツ**に限ります。
        送信すると自動チェックが走り、問題がなければ数分で地図に反映されます。
  - type: input
    id: video-url
    attributes:
      label: Youtube URL
      placeholder: https://www.youtube.com/watch?v=...
    validations:
      required: true
  - type: input
    id: lat
    attributes:
      label: 緯度
      placeholder: "35.690000"
    validations:
      required: true
  - type: input
    id: lng
    attributes:
      label: 経度
      placeholder: "139.692000"
    validations:
      required: true
  - type: dropdown
    id: tag-action
    attributes:
      label: 行動への影響
      options:
        - 訪問/地域紹介
        - 映像制作
        - お祭り/イベント
        - 機器/技術紹介
    validations:
      required: true
  - type: dropdown
    id: tag-atmosphere
    attributes:
      label: 動画の雰囲気
      options:
        - 明るい
        - 真面目
        - 落ち着いた
        - 緊張
        - 幻想的
        - スマート
    validations:
      required: true
  - type: dropdown
    id: tag-emotion
    attributes:
      label: 感情の核
      options:
        - 喜び
        - 興奮
        - 癒し
        - 驚き
        - 恐怖
        - 悲しみ
        - 希望
    validations:
      required: true
  - type: input
    id: manufacturer
    attributes:
      label: メーカー
      description: 任意。機器マスタ（public/data/equipment.json）にある名称を使ってください
  - type: input
    id: series
    attributes:
      label: シリーズ
      description: 任意
  - type: input
    id: model
    attributes:
      label: モデル
      description: 任意
  - type: checkboxes
    id: agreement
    attributes:
      label: 確認事項
      options:
        - label: この動画は自分が制作し、正当な権利を保有しています
          required: true
        - label: 位置情報と感情タグが公開されることに同意します
          required: true
