name: 撮影リクエスト
description: まだ動画が無い場所に「撮ってほしい」を投じます
title: "[request] 撮影リクエスト"
labels: ["loca:request"]
body:
  - type: markdown
    attributes:
      value: |
        1 アカウントあたりの熱量の合計は **5 まで**です。超過分は自動で差し戻されます。
  - type: input
    id: lat
    attributes:
      label: 緯度
    validations:
      required: true
  - type: input
    id: lng
    attributes:
      label: 経度
    validations:
      required: true
  - type: dropdown
    id: heat
    attributes:
      label: 熱量
      options: ["1", "2", "3", "4", "5"]
    validations:
      required: true
  - type: input
    id: season
    attributes:
      label: 季節
  - type: input
    id: time-of-day
    attributes:
      label: 撮影時間帯
  - type: input
    id: atmosphere
    attributes:
      label: 撮影雰囲気
  - type: input
    id: manufacturer
    attributes:
      label: メーカー
  - type: input
    id: series
    attributes:
      label: シリーズ
  - type: input
    id: model
    attributes:
      label: モデル
